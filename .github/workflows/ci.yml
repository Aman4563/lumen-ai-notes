# Deterministic release checks on every push and pull request.
#
# This intentionally mirrors `npm run check` (minus nothing): notes audit,
# unit/scale/storage/backup-memory gates, the AI/data test suites, the
# versioned retrieval evaluation, and the production build + static PWA audit.
# Browser workflows run against an isolated app server; real-model checks
# remain a separate local acceptance gate (`npm run check:live`).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 26 (pinned in .nvmrc): the AI timeout/deadline suites depend
          # on current test-runner timer semantics.
          node-version-file: .nvmrc
          cache: npm
      - name: Install exactly from the lockfile
        run: npm ci
      - name: Curriculum notes audit
        run: npm run audit:notes
      - name: Unit audit
        run: npm run audit:unit
      - name: Scale gates
        run: npm run audit:scale
      - name: Storage recovery gates
        run: npm run audit:storage
      - name: Backup memory gate
        run: npm run audit:backup-memory
      - name: AI/data test suites
        run: npm run audit:ai
      - name: Versioned retrieval evaluation
        run: npm run audit:ai-eval
      - name: Production build and app/PWA audit
        run: npm run audit:app
      - name: Browser workflows
        run: npm run check:browser
        env:
          LUMEN_LAYOUT_ARTIFACTS: ${{ runner.temp }}/lumen-responsive-results
      - name: Responsive audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-layout-results
          path: ${{ runner.temp }}/lumen-responsive-results
          if-no-files-found: ignore
